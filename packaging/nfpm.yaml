# nfpm-config voor SMUI — bouwt zowel .deb als .rpm uit één definitie.
# Docs: https://nfpm.goreleaser.com/configuration/
#
# Bouwen:  ./packaging/build.sh   (of handmatig: nfpm pkg -f packaging/nfpm.yaml -p deb -t dist/)

name: "smui"
arch: "all"            # architectuur-onafhankelijk (deb: all, rpm: noarch)
platform: "linux"
version: "${SMUI_VERSION}"
section: "admin"
priority: "optional"
maintainer: "Amjed <amjed@homelab.local>"
vendor: "Homelab"
homepage: "https://github.com/amjed/SMUI"
license: "MIT"
description: |
  SMUI - Storage Management UI.
  Een nmtui-achtige TUI voor opslagbeheer (partities, LVM PV/VG/LV,
  filesystems formatteren en mounten) op RHEL/Rocky/Alma en Ubuntu/Debian.

contents:
  - src: ./smui.sh
    dst: /usr/bin/smui
    file_info:
      mode: 0755
  - src: ./packaging/smui.1
    dst: /usr/share/man/man1/smui.1
    file_info:
      mode: 0644
  - src: ./README.md
    dst: /usr/share/doc/smui/README.md
    file_info:
      mode: 0644
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/smui/CHANGELOG.md
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/smui/LICENSE
    file_info:
      mode: 0644

# Runtime-afhankelijkheden verschillen per formaat: whiptail zit in 'newt' op
# RPM-distro's en in 'whiptail' op Debian/Ubuntu.
overrides:
  deb:
    depends:
      - lvm2
      - parted
      - util-linux
      - whiptail
  rpm:
    depends:
      - lvm2
      - parted
      - util-linux
      - newt
