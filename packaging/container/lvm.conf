# lvm.conf voor dmtui in een container (LVM_SYSTEM_DIR=/etc/dmtui/lvm).
# Alles wat hier niet staat valt terug op de ingebouwde standaardwaarden.
#
# De container heeft geen udev en geen dmeventd. Zonder deze instellingen
# blijven LVM-commando's hangen op udev-cookies of klagen ze over monitoring.
devices {
    obtain_device_list_from_udev = 0
    external_device_info_source = "none"
    # Geen /etc/lvm/devices/system.devices: die bestaat in de container niet.
    use_devicesfile = 0
}

activation {
    udev_sync = 0
    udev_rules = 0
    monitoring = 0
}
