name: Build & Release

# Bouwt .deb en .rpm packages met nfpm (via packaging/build.sh) en een
# container-image (Dockerfile) voor gebruik als pod op Kubernetes/Talos.
#   * Push van een tag v* -> bouwt en publiceert een GitHub Release met de packages,
#     en pusht ghcr.io/<repo>:X.Y.Z, :X.Y en :latest.
#   * Push naar main -> lint + build, en pusht het image als :edge.
#   * Handmatige run (workflow_dispatch) -> bouwt en uploadt de packages als artefact.
#   * Pull request -> alleen lint + build (image wordt gebouwd, niet gepusht).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck dmtui.sh packaging/build.sh

  build:
    name: Build packages
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie-consistentie controleren (bij tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          script_ver="$(grep -oP 'DMTUI_VERSION="\K[^"]+' dmtui.sh | head -n1)"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Script: ${script_ver} | Tag: ${tag_ver}"
          if [[ "$script_ver" != "$tag_ver" ]]; then
            echo "::error::Tag (${tag_ver}) komt niet overeen met DMTUI_VERSION (${script_ver}) in dmtui.sh"
            exit 1
          fi

      - name: Build .deb en .rpm
        run: |
          chmod +x packaging/build.sh
          ./packaging/build.sh

      - name: Artefacten uploaden
        uses: actions/upload-artifact@v4
        with:
          name: dmtui-packages
          path: dist/*
          if-no-files-found: error

      - name: Release publiceren
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dmtui ${{ github.ref_name }}
          body: |
            dmtui ${{ github.ref_name }} — packages voor Debian/Ubuntu (.deb) en RHEL/Rocky/Alma (.rpm).

            Installatie:
              Debian/Ubuntu : sudo apt install ./dmtui_*_all.deb
              RHEL/Rocky/Alma: sudo dnf install ./dmtui-*.noarch.rpm

            Wijzigingen: zie CHANGELOG.md.
          files: |
            dist/*.deb
            dist/*.rpm

  image:
    name: Container-image (GHCR)
    # Na build, zodat bij een tag de versiecontrole eerst gedraaid heeft.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen op GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=ref,event=pr

      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
